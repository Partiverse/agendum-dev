# 本地开发依赖（apps/server 的 Dart Frog/shelf 服务在 S05 接入后取消注释）。
services:
  postgres:
    image: postgres:16-alpine
    container_name: agendum-postgres
    environment:
      POSTGRES_USER: agendum
      POSTGRES_PASSWORD: agendum_dev_only
      POSTGRES_DB: agendum_dev
    ports:
      # 宿主机 5432 可能被本机 Postgres 占用（127.0.0.1 优先于 Docker 通配绑定），
      # 故映射到 5433。连接串: postgres://agendum:agendum_dev_only@localhost:5433/agendum_dev
      - '5433:5432'
    volumes:
      - agendum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agendum -d agendum_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  # server:
  #   build: ./apps/server
  #   environment:
  #     DATABASE_URL: postgres://agendum:agendum_dev_only@postgres:5432/agendum_dev  #     PORT: '8080'
  #   ports:
  #     - '8080:8080'
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  agendum_pgdata:
