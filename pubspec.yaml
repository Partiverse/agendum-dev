name: agendum
publish_to: none
description: 程簿（Agendum）monorepo 工作区根 —— Dart pub workspaces（ADR-015）。
environment:
  sdk: ^3.10.0
workspace:
  - packages/domain
  - packages/db
  - packages/protocol
  - packages/sync
  - packages/e2ee
  - packages/nlp
  - apps/server
  - apps/demo
  - apps/client
  - tools/eval
# 暂不入工作区(依赖未落地时加入会破坏解析):
#   packages/ui      → 首个组件落地后加入
#   packages/ai_client / tools/seed → 首个真实代码落地时加入
