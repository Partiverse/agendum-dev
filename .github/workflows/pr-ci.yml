name: pr-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.6'
      - name: Pub get（workspace）
        run: dart pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: |
          for p in packages/domain packages/protocol packages/sync packages/nlp apps/server tools/eval; do
            dart analyze --fatal-infos "$p" || exit 1
          done
      - name: Test
        run: |
          for p in packages/domain packages/protocol packages/sync packages/nlp apps/server tools/eval; do
            dart test "$p" || exit 1
          done
      - name: Golden eval（replay/本地，零 API 成本）
        run: dart run tools/eval/bin/eval.dart run --engine parse --min 0.75
