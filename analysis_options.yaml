# 全仓共享分析配置（各包通过相对路径 include 本文件）。
# 领域红线（02 文档 §6）：禁循环依赖、禁 UI 层直查 SQL —— 后续以自定义 lint 补齐。
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_single_quotes
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
